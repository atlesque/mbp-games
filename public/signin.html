<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · MBP Games</title>
<link rel="stylesheet" href="/style.css?v=3">
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<script src="/theme.js?v=3"></script>
</head>
<body>
<header class="nav"><a class="logo" href="/"><span class="mark"></span>MBP Games</a><div class="nav-r"><span id="back"></span><button class="iconbtn" data-theme-toggle aria-label="Switch theme"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg></button></div></header>
<div class="split">
  <section class="hero">
    <p class="eyebrow"><span class="dot"></span>One account · every game</p>
    <h1>Play anywhere.<br><span class="grad">Keep everything.</span></h1>
    <p>Sign in once with your email and your progress follows you to every MBP game, on any device. No password to remember.</p>
    <div class="tiles" id="tiles"></div>
  </section>
  <main class="card" aria-live="polite"><div id="view"><p><span class="spin"></span>Loading…</p></div></main>
</div>
<script>
// The hosted sign-in every MBP game sends players to. One email link both confirms the address and signs in;
// this tab waits for it (the link can be opened on any device) and then goes back to the game.
const q = Object.fromEntries(new URLSearchParams(location.search));
const target = q.client ? { client: q.client, redirect_uri: q.redirect_uri, state: q.state, code_challenge: q.code_challenge } : { next: q.next };
const view = document.getElementById('view');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const post = (path, body) => fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
  .then(async r => { const d = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(d.message || 'Something went wrong.'), { code: d.error }); return d; });
let game = null, timer = 0;
const KEY = 'mbpg_wait:' + location.search; // a reload keeps waiting for the same link

const gameName = () => game ? esc(game.name) : 'MBP Games';
const shortName = () => esc(game.name.replace(/^MBP\s*-\s*/, ''));
const initials = () => game.name.replace(/^MBP\s*-\s*/, '').split(/\s+/).map(w => w[0]).join('').slice(0, 2);
const backLink = () => game ? `<p class="small center" style="margin:18px 0 0"><a href="${esc(game.url)}">Back to ${shortName()} without signing in</a></p>` : '';
const arrow = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

function emailForm(msg) {
  clearTimeout(timer); sessionStorage.removeItem(KEY);
  view.innerHTML = `<p class="eyebrow">${game ? 'Sign in to' : 'One account · every game'}</p><h1>${game ? shortName() : 'Sign in'}</h1>
<p class="muted">New here? The same email link creates your account. No password needed.</p>
<form id="f"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required autofocus>
<p id="msg" class="err" role="alert" style="margin:10px 0 0">${msg ? esc(msg) : ''}</p><button class="btn" id="go">Email me a sign-in link ${arrow}</button></form>
<p class="small center" style="margin:18px 0 0">Links work once and run out after 15 minutes.</p>${backLink()}`;
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('go'), email = document.getElementById('email').value;
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const r = await post('/api/signin/start', { email, ...target });
      const w = { email, request: r.request, poll: r.poll };
      sessionStorage.setItem(KEY, JSON.stringify(w)); waiting(w);
    } catch (err) { document.getElementById('msg').textContent = err.message; btn.disabled = false; btn.innerHTML = `Email me a sign-in link ${arrow}`; }
  });
}

function waiting(w) {
  view.innerHTML = `<div class="center"><div class="inbox"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg></div>
<h1>Check your inbox</h1><p class="muted">We sent a sign-in link to <b style="color:var(--ink)">${esc(w.email)}</b>. Open it, on this device or another one, and press <b style="color:var(--ink)">Sign in</b>.</p></div>
<div class="note"><span class="spin"></span>This page carries on by itself once you have.</div>
<p class="small center">Nothing after a minute? Check your spam folder, or <a href="#" id="again">use a different email</a>.</p>`;
  document.getElementById('again').addEventListener('click', e => { e.preventDefault(); emailForm(); });
  const tick = async () => {
    try {
      const r = await post('/api/signin/poll', { request: w.request, poll: w.poll });
      if (r.status === 'done') { sessionStorage.removeItem(KEY); view.innerHTML = `<h1>You're in</h1><div class="note"><span class="spin"></span>Taking you back to ${gameName()}…</div>`; location.replace(r.redirect); return; }
      if (r.status === 'expired') return emailForm('That link ran out. Ask for a new one.');
      if (r.status === 'used') return start(); // another tab finished it; we're signed in here now
    } catch (err) { if (err.code === 'banned' || err.code === 'unknown') return emailForm(err.message); }
    timer = setTimeout(tick, document.hidden ? 4000 : 2000);
  };
  timer = setTimeout(tick, 2000);
}

async function start() {
  let s;
  try {
    const r = await fetch('/api/session?' + new URLSearchParams(Object.entries(q).filter(([k]) => ['client', 'redirect_uri', 'code_challenge', 'next'].includes(k))));
    s = await r.json();
    if (!r.ok) throw new Error(s.message);
  } catch (err) { view.innerHTML = `<h1>Can't sign in from here</h1><p class="err">${esc(err.message || 'Something went wrong.')}</p>`; return; }
  game = s.game;
  if (game) {
    document.getElementById('back').innerHTML = `<a class="sbtn" href="${esc(game.url)}">Back to ${shortName()}</a>`;
    document.getElementById('tiles').innerHTML = `<div class="card tile"><div class="gi">${esc(initials())}</div><b>${shortName()}</b><span>Your progress saves here</span></div>`;
  }
  const w = JSON.parse(sessionStorage.getItem(KEY) || 'null');
  if (w) return waiting(w);
  if (!s.user) return emailForm();
  view.innerHTML = `<p class="eyebrow">${game ? 'Play' : 'Welcome back'}</p><h1>${game ? shortName() : 'You\'re signed in'}</h1><p class="muted">You're signed in as <b style="color:var(--ink)">${esc(s.user.email)}</b>.</p>
<p id="msg" class="err" role="alert"></p><button class="btn" id="cont" autofocus>Continue ${arrow}</button>
<div class="divider">or</div><button class="btn ghost" id="other">Use a different email</button>${backLink()}`;
  document.getElementById('other').addEventListener('click', async e => { e.preventDefault(); await post('/api/signout', {}).catch(() => {}); emailForm(); });
  document.getElementById('cont').addEventListener('click', async () => {
    try { const r = await post('/api/signin/continue', target); location.replace(r.redirect); }
    catch (err) { document.getElementById('msg').textContent = err.message; }
  });
}
start();
</script>
</body>
</html>
