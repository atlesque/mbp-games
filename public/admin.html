<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Players · MBP Games admin</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f9" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/style.css?v=3">
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<script src="/theme.js?v=3"></script>
</head>
<body>
<header class="nav"><div class="row"><a class="logo" href="/"><span class="mark"></span>MBP Games</a><span class="tag">Admin</span></div><div class="nav-r"><a class="sbtn" href="/">Account</a><span id="me"></span><button class="iconbtn" data-theme-toggle aria-label="Switch theme"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg></button></div></header>
<main class="wrap">
  <div id="view"><p><span class="spin"></span>Loading…</p></div>
</main>
<script>
// Admin: every player, their games and progress; reset a game's progress, ban or unban, sign them out.
const view = document.getElementById('view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const when = t => t ? new Date(t).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '–';
const money = s => s && s.money != null ? '$' + s.money.toLocaleString() : '–';
const avatar = email => `<span class="av">${esc(String(email || '?')[0])}</span>`;
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = '/signin?next=/admin'; throw new Error('signed out'); }
  if (!r.ok) throw new Error(d.message || 'Something went wrong.');
  return d;
}
let q = '', offset = 0;

async function list() {
  let d;
  try { d = await api(`/api/admin/players?q=${encodeURIComponent(q)}&offset=${offset}`); } catch (e) { view.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  view.innerHTML = `<div class="top" style="margin-bottom:18px"><div><p class="eyebrow"><span class="dot"></span>${d.total} player${d.total === 1 ? '' : 's'}${q ? ` matching “${esc(q)}”` : ''}</p><h1 style="margin-bottom:0">Players</h1></div></div>
<section class="card tablecard"><div class="tbar"><form id="sf" class="row" role="search"><input type="search" id="q" placeholder="Search by email" value="${esc(q)}" aria-label="Search players by email" style="flex:1 1 200px"><button class="sbtn">Search</button></form></div>
<div class="scroll"><table><thead><tr><th>Player</th><th>Games</th><th>Money</th><th>Weapons</th><th>Last seen</th><th>Joined</th></tr></thead><tbody>
${d.players.map(p => { const sc = p.games.find(g => g.game === 'scrum-city'); return `<tr class="pick" tabindex="0" data-id="${esc(p.id)}">
<td><div class="who">${avatar(p.email)}<span>${esc(p.email)}</span>${p.bannedAt ? '<span class="tag ban">Banned</span>' : ''}</div></td><td>${p.games.map(g => `<span class="tag live">${esc(g.name.replace(/^MBP\s*-\s*/, ''))}</span>`).join(' ') || '<span class="muted">–</span>'}</td>
<td class="mono">${money(sc && sc.summary)}</td><td>${sc && sc.summary ? sc.summary.weapons.length : '–'}</td><td class="muted">${when(p.lastSeenAt)}</td><td class="muted">${when(p.createdAt)}</td></tr>`; }).join('') || '<tr><td colspan="6" class="muted">No players yet.</td></tr>'}
</tbody></table></div>
<div class="row pager">${offset ? '<button class="sbtn" id="prev">Previous</button>' : ''}${d.more ? '<button class="sbtn" id="next">Next</button>' : ''}</div></section>`;
  document.getElementById('sf').addEventListener('submit', e => { e.preventDefault(); q = document.getElementById('q').value.trim(); offset = 0; list(); });
  document.getElementById('prev')?.addEventListener('click', () => { offset = Math.max(0, offset - 50); list(); });
  document.getElementById('next')?.addEventListener('click', () => { offset += 50; list(); });
  for (const tr of view.querySelectorAll('tr.pick')) {
    const open = () => { location.hash = tr.dataset.id; };
    tr.addEventListener('click', open); tr.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
  }
}

async function player(id) {
  let p;
  try { p = (await api(`/api/admin/players/${id}`)).player; } catch (e) { view.innerHTML = `<p class="err">${esc(e.message)}</p><a href="#">Back</a>`; return; }
  const act = async (what, body, confirmText) => {
    if (confirmText && !confirm(confirmText)) return;
    try { await api(`/api/admin/players/${id}/${what}`, body || {}); player(id); } catch (e) { alert(e.message); }
  };
  view.innerHTML = `<p><a href="#">← All players</a></p>
<div class="panel"><div class="top"><div class="who" style="display:flex;gap:14px;align-items:center">${avatar(p.email).replace('class="av"', 'class="av" style="width:48px;height:48px;font-size:18px"')}<div><h2 style="margin:0">${esc(p.email)} ${p.bannedAt ? '<span class="tag ban">Banned</span>' : ''}</h2>
<p class="small">Joined ${when(p.createdAt)} · last seen ${when(p.lastSeenAt)} · ${p.sessions} active sign-in${p.sessions === 1 ? '' : 's'}${p.bannedAt ? ` · banned ${when(p.bannedAt)}${p.banReason ? `: ${esc(p.banReason)}` : ''}` : ''}</p></div>
</div><div class="row">${p.bannedAt ? '<button class="sbtn" id="unban">Unban</button>' : '<button class="sbtn danger" id="ban">Ban</button>'}<button class="sbtn" id="signout">Sign out everywhere</button></div></div></div>
<h2>Games</h2>
${p.games.map(g => `<div class="panel"><div class="top"><div><b>${esc(g.name)}</b><br><span class="small">Saved ${when(g.updatedAt)} · save #${g.rev}</span></div>
<button class="sbtn danger" data-reset="${esc(g.game)}">Reset progress</button></div>
${g.summary ? `<p>${money(g.summary)} · ${g.summary.kills} takedowns · weapons: ${esc(g.summary.weapons.join(', ') || 'none')}</p>` : '<p class="muted">Fresh start (no progress).</p>'}
${g.data ? `<details><summary class="small">Raw save</summary><pre>${esc(JSON.stringify(g.data, null, 2))}</pre></details>` : ''}</div>`).join('') || '<p class="muted">No saved games yet.</p>'}
<h2>History</h2>
${p.history.length ? `<div class="card tablecard"><div class="scroll"><table><tbody>${p.history.map(h => `<tr><td>${when(h.at)}</td><td>${esc(h.action)}${h.game ? ` ${esc(h.game)}` : ''}${h.detail ? `: ${esc(h.detail)}` : ''}</td><td class="small">${esc(h.admin)}</td></tr>`).join('')}</tbody></table></div></div>` : '<p class="muted">No admin actions yet.</p>'}`;
  document.getElementById('ban')?.addEventListener('click', () => { const reason = prompt(`Ban ${p.email}? Reason (shown to the player, optional):`); if (reason !== null) act('ban', { reason }); });
  document.getElementById('unban')?.addEventListener('click', () => act('unban'));
  document.getElementById('signout').addEventListener('click', () => act('signout', null, `Sign ${p.email} out of every game and browser?`));
  for (const b of view.querySelectorAll('[data-reset]')) b.addEventListener('click', () => act('reset', { game: b.dataset.reset }, `Reset ${p.email}'s progress in this game to a fresh start? This can't be undone.`));
}

function show() { const id = location.hash.slice(1); if (id) player(id); else list(); }
window.addEventListener('hashchange', show);
fetch('/api/account').then(r => r.json()).then(a => {
  if (!a.user) { location.href = '/signin?next=/admin'; return; }
  document.getElementById('me').innerHTML = `<span class="chip">${avatar(a.user.email)}<span>${esc(a.user.email)}</span></span>`;
  if (!a.admin) { view.innerHTML = '<p class="err">This account is not an admin.</p>'; return; }
  show();
});
</script>
</body>
</html>
